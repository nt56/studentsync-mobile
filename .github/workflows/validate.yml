name: Validate mobile
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: https://studentsync.example.com
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:env
      - run: npm run validate
      - run: npx expo install --check
      - run: npm run export:native

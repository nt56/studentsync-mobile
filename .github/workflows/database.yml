name: Database
on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/types/database.ts"
      - "scripts/staging-db-url.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/types/database.ts"
      - "scripts/staging-db-url.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
permissions:
  contents: read
# Never run two staging deploys at once.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the services the tests and type generation need.
      - name: Start Supabase
        run: npx supabase start -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and seed
        run: npx supabase db reset
      - name: pgTAP tests
        run: npx supabase test db
      - name: Lint
        run: npx supabase db lint --level warning --fail-on warning
      - name: Advisors
        run: npx supabase db advisors --level warn --fail-on warn
      - name: Generated types are current
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts || (echo "Run npm run db:types and commit src/types/database.ts" && exit 1)

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      # The session pooler string (IPv4). It holds no password, so a variable
      # is enough; a secret of the same name is accepted too.
      SUPABASE_DB_URL: ${{ vars.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Fails early with the name of what is wrong. The full URL is masked
      # before any later step can print it.
      - name: Build the database URL
        run: |
          url=$(node scripts/staging-db-url.mjs)
          echo "::add-mask::$url"
          echo "STAGING_DB_URL=$url" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Show pending migrations
        run: npx supabase db push --remote="$STAGING_DB_URL" --dry-run
      # --yes is required: CLI v3 refuses to change a hosted project without it.
      # Seed data is never pushed from CI.
      - name: Apply migrations to staging
        run: npx supabase db push --remote="$STAGING_DB_URL" --yes
